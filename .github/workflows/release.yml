name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # publish releases and tags via semantic-release

jobs:
  release:
    name: Test, build and release
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit SHA (supply-chain hardening); the comment
      # note carries the major tag each SHA resolved to on 2026-10-16.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false # semantic-release auths via GITHUB_TOKEN env

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile (check-types + esbuild)
        run: npm run check-types

      - name: Unit tests
        run: xvfb-run -a npm test

      - name: Verify VSCE_PAT secret is configured (required for marketplace publish)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Repository secret VSCE_PAT is missing or empty. Marketplace publishing cannot proceed. Add it in Settings → Secrets and variables → Actions → Repository secrets, named exactly 'VSCE_PAT' (Azure DevOps PAT with Marketplace 'Manage' scope)."
            exit 1
          fi
          echo "VSCE_PAT is configured (length: ${#VSCE_PAT} chars)."

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal Access Token for the VS Code Marketplace publish step
          # (vsce publish inside @semantic-release/exec). Optional: if not
          # set, the pipeline skips the marketplace publish and only creates
          # the GitHub Release with the VSIX attached.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx semantic-release
